<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="atms-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Fundo Quadrado Arredondado Vermelho ATMS -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#atms-grad)" filter="url(#shadow)" stroke="#f87171" stroke-width="1.2" />
  
  <!-- Letras ATMS em Branco de Alto Contraste -->
  <text 
    x="32" 
    y="38" 
    fill="#ffffff" 
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="16" 
    font-weight="900" 
    letter-spacing="1.2" 
    text-anchor="middle"
    dominant-baseline="central"
  >ATMS</text>
</svg>